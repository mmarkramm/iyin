<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>a little something for you 🎂</title>

    <!-- Open Graph / link preview tags.
         Without these, some apps (this is what happened before) fall
         back to scraping RANDOM text straight out of the page's HTML —
         including hidden modal/secret content — which is how spoilers
         leaked into the old link preview. These tags override that by
         telling the crawler exactly what to show instead: something
         vague and non-spoiler.
         Full "no preview at all" isn't really possible on static
         GitHub Pages (no server to detect/block crawlers), but this
         keeps the preview clean and gives nothing away. -->
    <meta property="og:title" content="you've got something 🎈" />
    <meta property="og:description" content="tap to find out :)" />
    <meta property="og:image" content="assets/opening.png" />
    <meta property="og:url" content="" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="you've got something 🎈" />
    <meta name="twitter:description" content="tap to find out :)" />
    <meta name="twitter:image" content="assets/opening.png" />

    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fdf6e3;
        overflow: hidden;
        touch-action: none;
        font-family: "Quicksand", "Marker Felt", "Bradley Hand ITC", "Comic Sans MS", cursive, sans-serif;
        transition: background-color 0.5s ease;
        padding: 16px;
      }

      .main-container {
        position: relative;
        width: 100%;
        max-width: 800px;
        aspect-ratio: 1024 / 540;
        max-height: calc(100vh - 32px);
        animation: pageIntro 0.9s ease both;
      }

      @keyframes pageIntro {
        0% { opacity: 0; transform: translateY(14px) scale(0.98); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes idleSway {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-2px) rotate(0.3deg); }
      }

      .idle-sway {
        animation: idleSway 4.5s ease-in-out infinite;
      }

      @keyframes tapBounce {
        0% { transform: scale(1); }
        30% { transform: scale(0.99) translateY(1.5px); }
        60% { transform: scale(1.005) translateY(-1px); }
        100% { transform: scale(1); }
      }

      .tap-bounce {
        animation: tapBounce 0.35s ease;
      }

      @keyframes pulse-bg {
        0% { transform: scale(1); }
        50% { transform: scale(1.03); }
        100% { transform: scale(1); }
      }

      .pulsing {
        animation: pulse-bg 1.5s ease-in-out infinite;
      }

      #secretModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
        touch-action: auto;
      }

      .modal-content {
        position: relative;
        width: 100%;
        max-width: 450px;
        max-height: 80vh;
        background: #fff9f0;
        border-radius: 12px;
        padding: 25px;
        border: 3px solid #ffb7b2;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .modal-content::-webkit-scrollbar {
        display: none;
      }

      .close-btn {
        position: sticky;
        top: 0;
        float: right;
        width: 35px;
        height: 35px;
        background: #ffb7b2;
        color: white;
        border: 2px solid #5d4037;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        z-index: 110;
        margin-top: -10px;
        margin-right: -10px;
        transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 2px 5px rgba(93, 64, 55, 0.15);
      }

      @media (hover: hover) {
        .close-btn:hover {
          background: #ff9a92;
          transform: scale(1.08) rotate(90deg);
          box-shadow: 0 3px 8px rgba(93, 64, 55, 0.25);
        }
      }

      .close-btn:active {
        transform: scale(0.92) rotate(90deg);
      }

      .letter-p {
        font-size: 15px;
        text-align: left;
        text-indent: 35px;
        margin-bottom: 15px;
      }

      .cat-slideshow {
        width: 80px;
        height: 80px;
        flex-shrink: 0;
        border-radius: 10px;
        border: 2px solid #b5ead7;
        box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.12);
        overflow: hidden;
        background: #fff;
      }

      .cat-slideshow img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        animation: fadeSwap 0.4s ease;
      }

      @keyframes fadeSwap {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .handwritten-msg {
        font-family: "Marker Felt", "Bradley Hand ITC", "Brush Script MT", "Apple Chancery", "Comic Sans MS", cursive;
        font-style: italic;
      }

      #flashOverlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #ffecd2;
        opacity: 0;
        pointer-events: none;
        z-index: 200;
        transition: opacity 0.15s ease-in-out;
      }

      .confetti {
        position: absolute;
        top: -20px;
        z-index: 15;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        animation: fall linear forwards, swing ease-in-out infinite alternate;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .heart {
        position: absolute;
        bottom: 25%;
        font-size: 20px;
        z-index: 12;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        animation: floatUp 1.5s ease-out forwards;
      }

      @keyframes fall {
        to { transform: translateY(110vh) rotate(720deg); }
      }
      @keyframes swing {
        from { margin-left: -20px; }
        to { margin-left: 20px; }
      }
      @keyframes floatUp {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-150px) scale(1.5); opacity: 0; }
      }

      .scene-img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: fill;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
        box-sizing: border-box;
        border: 4px solid transparent;
        transition: transform 0.3s ease, border 0.8s ease;
      }

      .framed {
        border: 4px solid #ffb7b2;
        border-radius: 4px;
      }

      /* Speech bubble container */
      .speech-overlay {
        position: absolute;
        top: 8%;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        pointer-events: none;
        z-index: 8;
      }

      .speech-overlay.hidden {
        display: none;
      }

      .speech-bubble {
        position: relative;
        display: inline-block;
        max-width: 65vw;
        min-height: 48px;
        text-align: center;
        overflow: hidden;
        background: #fdf9f2;
        border: 2px solid #e8ddc9;
        border-radius: 18px;
        padding: 12px 22px;
        box-shadow: 0 2px 6px rgba(93, 64, 55, 0.12);
      }

      @keyframes pop-bubble {
        0% { transform: scale(0.94); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      .bubble-pop {
        animation: pop-bubble 0.15s ease-out;
      }

      .speech-overlay::after {
        content: "";
        position: absolute;
        bottom: -14px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-top: 14px solid #e8ddc9;
      }

      .speech-overlay::before {
        content: "";
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-top: 12px solid #fdf9f2;
        z-index: 1;
      }

      .speech-overlay span {
        font-family: "Quicksand", sans-serif;
        font-weight: 700;
        font-size: 15px;
        line-height: 1.3;
        color: #5d4037;
        display: block;
        max-width: 100%;
        overflow-wrap: break-word;
      }

      /* Name overlay */
      .name-overlay {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 8;
      }

      .name-overlay span {
        font-family: "Quicksand", sans-serif;
        font-weight: 700;
        color: #7a3b4e;
        background: #ffe4e9;
        border: 2px solid #f5b8c4;
        border-radius: 999px;
        padding: 4px 16px;
        font-size: clamp(11px, 2vw, 18px);
        letter-spacing: 0.5px;
        box-shadow: 0 2px 6px rgba(214, 100, 130, 0.2);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .name-overlay span::before {
        content: "😽🧕";
        font-size: 0.85em;
      }

      .name-overlay span::after {
        content: "📚✨";
        font-size: 0.85em;
      }

      .bottom-hint {
        position: absolute;
        bottom: 5%;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        background: rgba(0, 0, 0, 0.75);
        display: inline-block;
        width: fit-content;
        max-width: 85%;
        padding: 4px 12px;
        border-radius: 6px;
        z-index: 10;
        transition: opacity 0.5s ease;
        text-align: center;
      }

      .hint-text {
        font-family: "Quicksand", sans-serif;
        font-size: 17px;
        color: #fff;
        font-weight: 700;
        white-space: normal;
        word-break: break-word;
        line-height: 1.3;
        letter-spacing: 0.5px;
        text-align: center;
      }

      .progress-container {
        position: absolute;
        bottom: 18%;
        left: 50%;
        transform: translateX(-50%);
        width: 60%;
        height: 18px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 20px;
        border: 2px solid #5d4037;
        display: none;
        overflow: hidden;
        z-index: 5;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background-color: #ffb7b2;
        background-image: linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.3) 25%,
          transparent 25%,
          transparent 50%,
          rgba(255, 255, 255, 0.3) 50%,
          rgba(255, 255, 255, 0.3) 75%,
          transparent 75%,
          transparent
        );
        background-size: 30px 30px;
        animation: moveStripes 1s linear infinite;
        transition: width 0.1s linear;
      }

      .click-ripple {
        position: absolute;
        width: 1px;
        height: 1px;
        background: rgba(255, 183, 178, 0.5);
        border-radius: 50%;
        pointer-events: none;
        z-index: 999;
        transform: translate(-50%, -50%);
        animation: ripple-out 1.2s ease-out forwards;
      }

      @keyframes ripple-out {
        0% { width: 0; height: 0; opacity: 0.7; }
        100% { width: 120px; height: 120px; opacity: 0; }
      }

      @keyframes moveStripes {
        from { background-position: 0 0; }
        to { background-position: 30px 0; }
      }

      .pin-wrapper {
        position: relative;
        width: 70px;
        margin: 10px auto 0;
        padding-top: 10px;
      }

      .pin-wrapper::before {
        content: "";
        position: absolute;
        top: 2px;
        left: 50%;
        transform: translateX(-50%);
        width: 14px;
        height: 14px;
        background: radial-gradient(circle at 30% 30%, #ff7675, #d63031);
        border-radius: 50%;
        border: 1.5px solid #5d4037;
        box-shadow: 1px 2px 3px rgba(0, 0, 0, 0.3);
        z-index: 10;
      }

      .sticky-note {
        position: relative;
        width: 65px;
        height: 65px;
        background: #fff3a0;
        border: 1px solid #e6db8e;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: top center;
        animation: wiggle 1.8s infinite ease-in-out;
        margin-top: -8px;
        transition: transform 0.2s ease, filter 0.2s ease;
      }

      .sticky-note:hover {
        filter: drop-shadow(0 0 5px rgba(255, 183, 178, 0.8));
        transform: rotate(0deg) scale(1.05);
      }
      .sticky-note:active {
        transform: scale(0.9);
      }

      .sticky-note span {
        font-family: "Marker Felt", cursive;
        font-size: 20px;
        color: #5d4037;
      }

      @media (max-width: 720px) {
        body { padding: 10px; }
        .main-container { max-width: 100%; }
        #secretModal, #psModal { padding: 12px; }
        .modal-content {
          max-width: 100%;
          margin: 0 6px;
          max-height: calc(100vh - 38px);
          padding: 20px;
        }
        .bottom-hint { max-width: 90%; bottom: 5%; padding: 6px 10px; }
        .hint-text { font-size: 15px; }
        .progress-container { bottom: 20%; }
        .letter-p { font-size: 14px; text-indent: 28px; }
        .handwritten-msg { font-size: 16px; }
        .close-btn { width: 32px; height: 32px; font-size: 18px; margin-top: -8px; margin-right: -8px; }
        .pin-wrapper { width: 60px; }
      }

      @keyframes wiggle {
        0% { transform: rotate(-8deg); }
        50% { transform: rotate(8deg); }
        100% { transform: rotate(-8deg); }
      }

      #rotateOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fdf6e3;
        z-index: 999;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px;
      }

      #rotateOverlay .rotate-icon {
        font-size: 48px;
        margin-bottom: 16px;
        animation: rotateHint 1.6s ease-in-out infinite;
      }

      @keyframes rotateHint {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(90deg); }
      }

      #rotateOverlay p {
        font-family: "Quicksand", sans-serif;
        font-weight: 700;
        color: #5d4037;
        font-size: 16px;
        max-width: 280px;
        margin-bottom: 18px;
      }

      #rotateOverlay button {
        font-family: "Quicksand", sans-serif;
        font-weight: 700;
        background: #ffb7b2;
        color: #5d4037;
        border: 2px solid #5d4037;
        border-radius: 20px;
        padding: 8px 20px;
        font-size: 14px;
        cursor: pointer;
      }

      @media (max-width: 820px) and (orientation: portrait) {
        #rotateOverlay.active {
          display: flex;
        }
      }
    </style>
  </head>

  <body>
    <div id="rotateOverlay">
      <div class="rotate-icon">📱</div>
      <p>this is best experienced in landscape — turn your phone sideways :)</p>
      <button id="continuePortraitBtn">continue anyway</button>
    </div>

    <div class="main-container" id="mainContainer">
      <div id="secretModal">
        <div class="modal-content">
          <div class="close-btn" onclick="closeModal()">X</div>
          <div style="color: #5d4037; line-height: 1.6">
            <h4
              id="secretHeader"
              style="margin-bottom: 5px; color: #ffb7b2; font-size: 13px; text-align: center;"
            ></h4>
            <h2
              class="handwritten-msg"
              style="margin-bottom: 20px; color: #5d4037; text-align: center; font-size: 22px;"
            >
              To my cutie indo friend...
            </h2>

            <p id="secretBodyMain" class="letter-p handwritten-msg"></p>

            <p
              id="secretBodySecondary"
              class="letter-p handwritten-msg"
              style="margin-bottom: 0px; padding-bottom: 0px"
            ></p>

            <p
              id="secretSignoff"
              class="handwritten-msg"
              style="margin-bottom: 0px; text-align: right; font-weight: bold; font-size: 18px;"
            ></p>

            <p
              style="text-align: center; font-size: 11px; color: #a8a8a8; font-style: italic; margin-top: 10px; margin-bottom: -5px;"
            >
              // open secret_note.iyin ⬇️✨
            </p>

            <div class="pin-wrapper" style="margin-top: 15px; padding-top: 0px">
              <div
                class="sticky-note"
                onclick="showPS()"
                title="a secret note inside a secret note?!?!?!"
              >
                <span>JM</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div
        id="psModal"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 150; padding: 20px;"
      >
        <div
          class="modal-content"
          style="max-width: 400px; border-color: #b5ead7; padding-top: 40px; scrollbar-width: none; -ms-overflow-style: none;"
        >
          <div
            class="close-btn"
            onclick="closePS()"
            style="background: #b5ead7; position: absolute; top: 10px; right: 10px; margin: 0;"
          >
            X
          </div>

          <div style="color: #5d4037; line-height: 1.8">
            <p id="psBodyMain" style="font-size: 16px; text-align: center;"></p>
            <p style="text-align: center; color: #b5ead7">✦ ✦ ✦</p>
            <p id="psBodySecondary" style="font-size: 16px; text-align: center"></p>

            <div
              style="display: flex; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 10px; padding: 0 10px; gap: 10px;"
            >
              <p
                id="psFooter"
                style="font-size: 11px; font-style: italic; color: #a8a8a8; margin: 0; line-height: 1.4; text-align: center; max-width: 250px; letter-spacing: 0.2px;"
              ></p>

              <div id="catSlideshow" class="cat-slideshow">
                <img id="catSlideshowImg" src="assets/cat-1.jpg" alt="cute cat" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="flashOverlay"></div>
      <img id="bg" class="scene-img" src="assets/opening.png" />

      <div id="speechOverlay" class="speech-overlay">
        <div id="speechBubble" class="speech-bubble">
          <span id="speechText"></span>
        </div>
      </div>

      <div id="nameOverlay" class="name-overlay">
        <span id="nameText"></span>
      </div>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div id="hintBubble" class="bottom-hint">
        <div id="hint" class="hint-text">tap me :)</div>
      </div>
    </div>

    <script>
      /* ============================================================
         CONFIG — everything person-specific lives here.
      ============================================================= */
      const config = {
        name: "Iyin",
        fromName: "Mark",

        // Typewriter speed in milliseconds per character (lower = faster)
        typingSpeedMs: 28,

        // taps on the final scene needed to reveal the secret note
        unlockTaps: 28,

        // how long (ms) they must hold to complete the hug
        hugDurationMs: 4000,

        // shown in the speech bubble the moment she first holds down
        // to start the hug (replaces the "can we hug?" prompt)
        hugThanksMessage: "awe thanks!",

        // cat slideshow in the P.S. note — expects assets/cat-1.png
        // through assets/cat-{catImageCount}.png
        catImageCount: 6,
        catSlideshowIntervalMs: 1500,

        // letting go early this many times triggers quick-hug celebration
        quickHugCancelCount: 4,

        images: {
          opening: "assets/opening.png",
          final: "assets/final_default.png",
        },

        introMessages: [
          "hellooo! i'm Mark :)",
          "oh it's you iyin!!!!",
          "it's been a while!",
          "i'm really glad that you are here!!",
          "can we hug for a bit? 🤗",
        ],

        stayEasterEgg: {
          atIndex: 3,
          delayMs: 4000,
          message:
            "Secret Unlocked: 4th text and you stayed for 4 seconds. 🎉 Cutieee you found the easter eggs haha ty ✨",
        },

        finalMessages: [
          "Surprise! 🎉",
          "Happy 28th Birthday Iyin!! 🎉",
          "I hope you have an amazing day filled with love, laughter, and all the things that make you happiest! 🥳",
        ],

        randomExtraMessages: [
          "aaaa Enjoy your special day!! 🎂",
          "happy happy happyyyy bdayyyyyyyy!! 🎉",
          "thanks for checking out my little project! 😄",
          "Debbie Cake!!!! hahaha i miss you!!",
          "keep tapping for a secret??? 👀",
          "Selamat ulang tahun 🎉",
          "Maligayang kaarawan! 🎉",
          "Sending more hugs your way!! 🤗",
          "habaduuuuuu!! hahaha",
          "cutieeeeeee!! 🥰",
          "wait there are secrets? where are they?!!? 🤣",
          "I appreciate you sm",
          "Happy Birthday again!! x8171998",
          "Aku senang dan bangga padamu",
          "you deserve all the good things in the world!!",
          "awee you're still here",
          "i'm really glad you exist",
          "i hope you smile a lot today!",
          "Thanks for the hugs!! 🤗 there's a secret there!",
        ],

        milestones: {
          5: "i'm wishing you all the best :)",
          10: "more birthdays to come!!",
          15: "looking for something? 🤣",
          20: "you're so cute for tapping this many times haha!!",
          24: "stop! haha jk, you're almost there!!",
          27: "one more 😉",
        },

        quickHugMessage: "awww Iyin! that was a lot of hugs thank you! hahaha!!",

        secretNote: {
          header: "aweee you kept on going.. and found this secret bday msg🥺 by tapping {unlockTaps} times!! thank you!",
          bodyMain:
            "Haiii Iyinnnn!!!! I’m really glad I got to celebrate your birthday with you through this little project, even if just for a while :) . I’m just really happy I could make something like this for someone as kind and precious as youuu.",
          bodySecondary:
            "I’m always wishing you the best in everythinggg ✨ and please know that I’m supporting you from afar and rooting for your happiness every single day😊. You deserve all the good things that come your way. Stay precious and amazing! 💖",
        },

        psNote: {
          bodyMain:
            "haiiii future iyin!, this is past mark! i'm sending this forward in time and hoping it reaches you. wait, you're actually here?! hahaha okayyy I'm way more excited rn, and also I had so much fun making this whole thing. thanks for checking this project out and celebrating your day with the future me even for a while :)",
          bodySecondary:
            "Have the Happiest of Birthdays iyin!! 🎉🎂🧕✨",
          footer: "// end of secret_note.iyin 🎉✨",
        },

        nameOverlayPosition: { top: "68%", left: "50%", width: "40%" },
      };
      /* ============================================================
         END CONFIG
      ============================================================= */

      document.title = `For ${config.name} 🎂`;

      // --- Orientation lock logic ---
      const rotateOverlay = document.getElementById("rotateOverlay");
      const continuePortraitBtn = document.getElementById("continuePortraitBtn");
      let portraitDismissed = false;

      function checkOrientation() {
        const isNarrowPhone = window.innerWidth <= 820;
        const isPortrait = window.innerHeight > window.innerWidth;
        if (isNarrowPhone && isPortrait && !portraitDismissed) {
          rotateOverlay.classList.add("active");
        } else {
          rotateOverlay.classList.remove("active");
        }
      }

      continuePortraitBtn.addEventListener("click", () => {
        portraitDismissed = true;
        rotateOverlay.classList.remove("active");
      });

      window.addEventListener("resize", checkOrientation);
      window.addEventListener("orientationchange", checkOrientation);
      checkOrientation();

      const container = document.getElementById("mainContainer");
      const bg = document.getElementById("bg");
      const hint = document.getElementById("hint");
      const hintBubble = document.getElementById("hintBubble");
      const progressContainer = document.getElementById("progressContainer");
      const progressBar = document.getElementById("progressBar");
      const flashOverlay = document.getElementById("flashOverlay");
      const secretModal = document.getElementById("secretModal");
      const psModal = document.getElementById("psModal");
      const speechText = document.getElementById("speechText");
      const speechOverlayEl = document.getElementById("speechOverlay");
      const speechBubbleEl = document.getElementById("speechBubble");
      const nameOverlay = document.getElementById("nameOverlay");
      const nameText = document.getElementById("nameText");

      // Populate name overlay
      nameOverlay.style.top = config.nameOverlayPosition.top;
      nameOverlay.style.left = config.nameOverlayPosition.left;
      nameOverlay.style.width = config.nameOverlayPosition.width;
      nameOverlay.style.transform = "translateX(-50%)";
      nameText.innerText = config.name;

      // Populate secret note + PS note
      document.getElementById("secretHeader").innerText =
        config.secretNote.header.replace("{unlockTaps}", config.unlockTaps);
      document.getElementById("secretBodyMain").innerText = config.secretNote.bodyMain;
      document.getElementById("secretBodySecondary").innerText = config.secretNote.bodySecondary;
      document.getElementById("secretSignoff").innerText = `— ${config.fromName}`;
      document.getElementById("psBodyMain").innerText = config.psNote.bodyMain;
      document.getElementById("psBodySecondary").innerText = config.psNote.bodySecondary;
      document.getElementById("psFooter").innerText = config.psNote.footer;

      bg.addEventListener("dragstart", (e) => e.preventDefault());
      bg.addEventListener("touchmove", (e) => {
        if (holding) e.preventDefault();
      });

      const preloadImg = new Image();
      preloadImg.src = config.images.final;

      let scene = 1;
      let step = 0;
      let progress = 0;
      let interval = null;
      let holding = false;
      let tapCount = 0;
      let scene3Taps = 0;
      let cancelCount = 0;
      let isLocked = false;
      let hugThanksShown = false;
      let introTimer = null;

      // The first run through the final scene shows every configured message
      // once in order. After that, repeat taps can use the full message pool.
      const orderedFinalMessages = [
        ...config.finalMessages,
        ...config.randomExtraMessages,
      ];
      const allFinalMessages = [...orderedFinalMessages];
      let orderedFinalMessageIndex = 0;

      // --- TYPEWRITER & SPEECH SYSTEM ---
      const SPEECH_MAX_FONT_PX = 15;
      const SPEECH_MIN_FONT_PX = 7;
      let typeInterval = null;
      let isTyping = false;
      let currentTargetText = "";

      function vibrate(ms = 25) {
        if (navigator.vibrate) {
          try {
            navigator.vibrate(ms);
          } catch (e) {}
        }
      }

      function fitSpeechText() {
        const target = currentTargetText || speechText.innerText;
        if (!target) return;

        const currentDisplay = speechText.innerText;
        speechText.innerText = target;

        let fontSize = SPEECH_MAX_FONT_PX;
        speechText.style.fontSize = fontSize + "px";

        let guard = 0;
        while (
          (speechText.scrollHeight > speechBubbleEl.clientHeight ||
            speechText.scrollWidth > speechBubbleEl.clientWidth) &&
          fontSize > SPEECH_MIN_FONT_PX &&
          guard < 40
        ) {
          fontSize -= 0.5;
          speechText.style.fontSize = fontSize + "px";
          guard++;
        }

        speechText.innerText = currentDisplay;
      }

      function setSpeech(text, animate = true, onComplete = null) {
        // Keep compatibility with calls that pass a completion callback second.
        if (typeof animate === "function") {
          onComplete = animate;
          animate = true;
        }

        if (typeInterval) {
          clearInterval(typeInterval);
          typeInterval = null;
        }

        if (!text) {
          speechOverlayEl.classList.add("hidden");
          speechText.innerText = "";
          currentTargetText = "";
          isTyping = false;
          speechBubbleEl.classList.remove("bubble-pop");
          return;
        }

        speechOverlayEl.classList.remove("hidden");
        currentTargetText = text;

        // Pre-fit font size based on full text length
        speechText.innerText = text;
        fitSpeechText();

        if (!animate) {
          speechBubbleEl.classList.remove("bubble-pop");
          void speechBubbleEl.offsetWidth;
          speechBubbleEl.classList.add("bubble-pop");
          isTyping = false;
          if (onComplete) onComplete();
          return;
        }

        speechBubbleEl.classList.remove("bubble-pop");
        speechText.innerText = "";

        let charIndex = 0;
        isTyping = true;

        typeInterval = setInterval(() => {
          charIndex++;
          speechText.innerText = text.slice(0, charIndex);

          if (charIndex >= text.length) {
            clearInterval(typeInterval);
            typeInterval = null;
            isTyping = false;
            if (onComplete) onComplete();
          }
        }, config.typingSpeedMs || 28);
      }

      function completeTyping() {
        if (typeInterval) {
          clearInterval(typeInterval);
          typeInterval = null;
        }
        speechText.innerText = currentTargetText;
        isTyping = false;
      }

      window.addEventListener("resize", () => fitSpeechText());

      // Start initial scene dialog with typing animation
      setSpeech(config.introMessages[0]);
      nameOverlay.style.display = "none";
      bg.classList.add("idle-sway"); // gentle sway during the quiet intro

      document.body.addEventListener("click", (e) => {
        if (
          secretModal.style.display === "flex" ||
          psModal.style.display === "flex" ||
          isLocked
        )
          return;

        vibrate(20);

        if (scene === 1) {
          // If still typing, tap completes line immediately
          if (isTyping) {
            bg.classList.remove("tap-bounce");
            void bg.offsetWidth;
            bg.classList.add("tap-bounce");
            completeTyping();
            return;
          }

          clearTimeout(introTimer);
          step++;
          if (step < config.introMessages.length) {
            // small bounce on the character — only while still moving
            // through intro messages, never on the tap that transitions
            // into the hug scene (that tap ends up in the else branch)
            bg.classList.remove("tap-bounce");
            void bg.offsetWidth; // restart animation even on rapid taps
            bg.classList.add("tap-bounce");

            setSpeech(config.introMessages[step]);

            if (step === config.stayEasterEgg.atIndex) {
              introTimer = setTimeout(() => {
                if (scene === 1 && step === config.stayEasterEgg.atIndex) {
                  hint.innerText = config.stayEasterEgg.message;
                  vibrate([30, 100, 30, 100, 30]);
                }
              }, config.stayEasterEgg.delayMs);
            }
          } else {
            setupHug();
          }
        } else if (scene === 3) {
          tapCount++;
          scene3Taps++;

          flashOverlay.style.transition = "opacity 0.05s";
          flashOverlay.style.opacity = "0.08";
          setTimeout(() => {
            flashOverlay.style.opacity = "0";
          }, 50);

          if (
            scene3Taps >= 2 &&
            !config.milestones[tapCount]
          ) {
            hintBubble.style.opacity = "0";
            setTimeout(() => {
              hintBubble.style.visibility = "hidden";
            }, 500);
          }

          // Milestone celebrations
          if (config.milestones[tapCount]) {
            hintBubble.style.opacity = "1";
            hintBubble.style.visibility = "visible";
            hint.innerText = config.milestones[tapCount];
            vibrate([30, 50, 30]);
            const milestoneEmojiSets = ["🎉", "✨", "💖", "🥳", "🎂", "🎁", "🎈", "💫", "🌟", "🎊", "💝", "🐈", "😻"];
            spawnMilestoneEmojis(milestoneEmojiSets, 8 + tapCount / 2);

            // soft "haptic-style" visual pulse to pair with the vibration —
            // a gentle warm flash, same idea as the hug's color shift,
            // just quick and understated so it doesn't feel gaudy
            flashOverlay.style.background = "#ffe9c7";
            flashOverlay.style.transition = "opacity 0.15s ease";
            flashOverlay.style.opacity = "0.22";
            setTimeout(() => {
              flashOverlay.style.opacity = "0";
            }, 180);
          }

          if (tapCount === config.unlockTaps) {
            vibrate([40, 100, 40]);
            openModal();
          } else {
            setSpeech(getNextFinalMessage(), false);
          }
        }
      });

      function openModal() {
        secretModal.style.display = "flex";
        // little celebration burst right as the secret unlocks
        for (let i = 0; i < 22; i++) {
          setTimeout(() => spawnConfetti(), i * 25);
        }
      }

      function getNextFinalMessage() {
        if (orderedFinalMessageIndex < orderedFinalMessages.length) {
          const message = orderedFinalMessages[orderedFinalMessageIndex];
          orderedFinalMessageIndex++;
          return message;
        }

        return allFinalMessages[Math.floor(Math.random() * allFinalMessages.length)];
      }

      function closeModal() {
        vibrate(15);
        secretModal.style.display = "none";
        tapCount = 0;
        scene3Taps = 0;
      }

      function showPS() {
        vibrate([30, 50, 30]);
        document.getElementById("secretModal").style.display = "none";
        document.getElementById("psModal").style.display = "flex";
        startCatSlideshow();
      }

      function closePS() {
        vibrate(15);
        psModal.style.display = "none";
        secretModal.style.display = "flex";
        stopCatSlideshow();
      }

      // --- Cat slideshow: cycles assets/cat-1.png through cat-N.png
      // every ~1s while the P.S. modal is open. Change catImageCount
      // in config if you have a different number of images.
      let catSlideshowInterval = null;
      let catSlideshowIndex = 0;
      const catSlideshowImgEl = document.getElementById("catSlideshowImg");

      function startCatSlideshow() {
        stopCatSlideshow();
        catSlideshowIndex = 0;
        catSlideshowImgEl.src = `assets/cat-1.jpg`;
        catSlideshowInterval = setInterval(() => {
          catSlideshowIndex = (catSlideshowIndex % config.catImageCount) + 1;
          catSlideshowImgEl.src = `assets/cat-${catSlideshowIndex}.jpg`;
        }, config.catSlideshowIntervalMs);
      }

      function stopCatSlideshow() {
        clearInterval(catSlideshowInterval);
      }

      function setupHug() {
        scene = 2;
        cancelCount = 0;
        hugThanksShown = false;
        bg.classList.remove("idle-sway"); // done once the intro scene ends
        hint.innerText = "hold to hug";
        progressContainer.style.display = "block";
        // Bubble clears the instant she taps past "can we hug for a
        // bit" — it only reappears once, the first time she touches
        // the screen in this hug scene (see holdStart below).
        setSpeech("");

        setTimeout(() => {
          window.addEventListener("pointerdown", holdStart);
          window.addEventListener("pointerup", holdEnd);
          window.addEventListener("pointerleave", holdEnd);
          window.addEventListener("pointercancel", holdEnd);
        }, 100);
      }

      function holdStart(e) {
        if (scene !== 2 || isLocked) return;
        e.preventDefault();
        if (holding) return;
        holding = true;

        // Reveal the "thanks!" bubble only the very first time she
        // touches the screen in this scene. After that it stays put —
        // repeated taps/holds (including quick-cancel attempts for the
        // easter egg) won't keep re-triggering the typing animation.
        if (!hugThanksShown) {
          hugThanksShown = true;
          setSpeech(config.hugThanksMessage);
        }

        document.body.style.cursor = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' style='font-size:30px'><text y='30'>🤗</text></svg>"), auto`;

        bg.classList.add("pulsing");
        bg.classList.add("framed");

        hint.innerText = "hugging you...";

        if (navigator.vibrate) {
          navigator.vibrate([40, 60, 40, 400, 40, 60, 40, 400, 40, 60, 40, 400, 40, 60, 40, 400]);
        }

        const stepMs = 50;
        const stepsTotal = config.hugDurationMs / stepMs;
        const progressPerStep = 100 / stepsTotal;

        interval = setInterval(() => {
          if (!holding) return;
          progress += progressPerStep;
          progressBar.style.width = Math.min(progress, 100) + "%";
          document.body.style.backgroundColor = `rgb(253, ${246 - progress / 2.5}, ${227 - progress / 5})`;
          spawnHeart();

          if (Math.floor(progress) % 10 === 0) vibrate(25);

          if (progress >= 100) finishHug();
        }, stepMs);
      }

      function holdEnd() {
        // Freeze the current mid-pulse scale, then let the existing
        // transform transition ease it back to normal — this avoids
        // the abrupt "jump" that happened when spam-tapping quickly
        // cancelled the animation mid-cycle before.
        const currentTransform = getComputedStyle(bg).transform;
        bg.classList.remove("pulsing");
        bg.style.transform = currentTransform;
        requestAnimationFrame(() => {
          bg.style.transform = "scale(1)";
        });
        setTimeout(() => {
          bg.style.transform = "";
        }, 350);

        document.body.style.cursor = "default";

        if (scene !== 2 || isLocked) return;
        holding = false;
        clearInterval(interval);
        if (navigator.vibrate) navigator.vibrate(0);

        if (progress < 100) {
          progress = 0;
          progressBar.style.width = "0%";
          document.body.style.backgroundColor = "#fdf6e3";
          bg.classList.remove("framed");

          cancelCount++;

          if (cancelCount === config.quickHugCancelCount) {
            isLocked = true;
            cancelCount = 0;

            progressContainer.style.borderColor = "#ffd700";
            progressContainer.style.boxShadow = "0 0 10px #ffd700";
            hint.innerText = config.quickHugMessage;

            vibrate([50, 100, 50, 100, 50]);

            const specialEmojis = ["❤️", "🥳", "✨", "🎉", "💖", "🐈", "😻"];
            for (let i = 0; i < 15; i++) {
              setTimeout(() => {
                const emoji = specialEmojis[Math.floor(Math.random() * specialEmojis.length)];
                spawnSpecialEmoji(emoji);
              }, i * 50);
            }

            setTimeout(() => {
              isLocked = false;
              progressContainer.style.borderColor = "#5d4037";
              progressContainer.style.boxShadow = "none";
              if (!holding) hint.innerText = "hold to hug";
            }, 3000);
          } else {
            hint.innerText = "don't let go yet! :(";
            vibrate(60);
          }
        }
      }

      function spawnSpecialEmoji(symbol) {
        const el = document.createElement("div");
        el.className = "heart";
        el.innerText = symbol;
        el.style.left = Math.random() * 80 + 10 + "%";
        el.style.bottom = "20%";
        container.appendChild(el);
        setTimeout(() => el.remove(), 1500);
      }

      function spawnMilestoneEmojis(emojis, count) {
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const el = document.createElement("div");
            el.className = "heart";
            el.innerText = emoji;
            el.style.left = Math.random() * 80 + 10 + "%";
            el.style.bottom = "25%";
            el.style.fontSize = "24px";
            el.style.animationDuration = "2s";
            container.appendChild(el);
            setTimeout(() => el.remove(), 2000);
          }, i * 30);
        }
      }

      function finishHug() {
        holding = false;
        bg.classList.remove("pulsing");
        document.body.style.cursor = "default";
        clearInterval(interval);
        window.removeEventListener("pointerdown", holdStart);
        window.removeEventListener("pointerup", holdEnd);

        vibrate([30, 150, 30]);
        hint.innerText = "hehe that felt nice. thank you :)";

        setTimeout(() => {
          flashOverlay.style.opacity = "1";

          setTimeout(() => {
            scene = 3;
            progressContainer.style.display = "none";
            bg.src = config.images.final;
            nameOverlay.style.display = "flex";
            setSpeech(config.finalMessages[0], false);
            // The opening message is already visible before the first tap.
            orderedFinalMessageIndex = 1;
            hint.innerText = "tap for more :)";
            startConfetti();

            setTimeout(() => {
              flashOverlay.style.opacity = "0";
            }, 50);
          }, 150);
        }, 300);
      }

      function spawnHeart() {
        if (Math.random() > 0.15) return;
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerText = "❤️";
        heart.style.left = Math.random() * 40 + 30 + "%";
        container.appendChild(heart);
        setTimeout(() => heart.remove(), 1500);
      }

      function startConfetti() {
        for (let i = 0; i < 20; i++) spawnConfetti();
        setInterval(spawnConfetti, 100);
      }

      function spawnConfetti() {
        const confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.style.left = Math.random() * 100 + "%";

        if (Math.random() < 0.5) {
          const colors = ["#ffb7b2", "#ffdac1", "#e2f0cb", "#b5ead7", "#c7ceea", "#fff4bd"];
          confetti.style.width = "10px";
          confetti.style.height = "10px";
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.borderRadius = "2px";
        } else {
          const emojis = ["💙", "💝", "💜", "💞", "🎉", "✨", "💖", "🎂", "🎁", "🎈", "🌟", "🎊", "💟", "🥳", "🎆", "🎇"];
          confetti.innerText = emojis[Math.floor(Math.random() * emojis.length)];
          confetti.style.fontSize = "20px";
          confetti.style.pointerEvents = "none";
          confetti.style.userSelect = "none";
        }

        const fallDuration = Math.random() * 2.5 + 2.5 + "s";
        const swingDuration = Math.random() * 0.5 + 0.5 + "s";
        confetti.style.animationDuration = `${fallDuration}, ${swingDuration}`;
        confetti.style.opacity = Math.random() * 0.5 + 0.5;
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 5000);
      }

      function createRipple(e) {
        const ripple = document.createElement("div");
        ripple.className = "click-ripple";
        const x = e.clientX || (e.touches && e.touches[0].clientX);
        const y = e.clientY || (e.touches && e.touches[0].clientY);
        ripple.style.left = x + "px";
        ripple.style.top = y + "px";
        document.body.appendChild(ripple);
        setTimeout(() => {
          ripple.remove();
        }, 1200);
      }

      document.body.addEventListener("pointerdown", createRipple);

      // Dev shortcuts for testing
      document.addEventListener("keydown", (e) => {
        if (e.key === "F8") {
          finishHug();
        }
        if (e.key === "F4") {
          console.log("Testing Secret Modal...");
          openModal();
        }
      });
    </script>
  </body>
</html>
